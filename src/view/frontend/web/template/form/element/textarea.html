<textarea class="input-text"
          data-bind="
    value: value,
    valueUpdate: valueUpdate,
    hasFocus: focused,
    attr: {
        name: inputName,
        cols: cols,
        rows: rows,
        maxlength: maxlength,
        'aria-describedby': noticeId,
        'aria-required': required,
        'aria-invalid': error() ? true : false,
        placeholder: placeholder,
        id: uid,
        disabled: disabled
    }"
></textarea>
